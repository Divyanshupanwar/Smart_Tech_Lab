services:
  app:
    build: .
    image: smart-tech-lab:latest
    container_name: smart-tech-lab-app
    restart: unless-stopped

    ports:
      - "8080:10000"

    environment:
      NODE_ENV: production
      PORT: "10000"

      DB_CONNECT_STRING: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/smart_tech_lab?authSource=admin"

      JWT_KEY: ${JWT_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: default
      REDIS_PASS: ${REDIS_PASS}
      REDIS_TLS: "false"

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      MAIL_SERVICE: ${MAIL_SERVICE:-gmail}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Smart Tech Lab}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:latest
    container_name: smart-tech-lab-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: smart-tech-lab-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASS}

    environment:
      REDIS_PASS: ${REDIS_PASS}

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$${REDIS_PASS}" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data: