name: Smart Tech Lab CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment environment file
        shell: bash
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          printf '%s' "$DEPLOY_ENV_FILE" > .env.docker
          chmod 600 .env.docker

      - name: Validate Docker Compose
        run: |
          docker compose \
            --env-file .env.docker \
            -f docker-compose.yml config -q

      - name: Build and deploy application
        run: |
          docker compose \
            --env-file .env.docker \
            -f docker-compose.yml \
            up -d --build

      - name: Verify application health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo
              echo "Smart Tech Lab is healthy!"
              exit 0
            fi

            sleep 2
          done

          docker compose \
            --env-file .env.docker \
            -f docker-compose.yml \
            logs --tail=100 app || true

          exit 1

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.docker